<body>
  <header><div class="head"><div class="brand"><span class="mark" aria-hidden="true">Σ</span>Sigma Dispatch</div><div id="account"></div></div></header>
  <main class="shell"><div class="command" id="command"></div><div id="notice" role="status" aria-live="polite"></div><div id="screen"></div></main>
  <div id="chat"></div>
<script>
const offlineBundle=(()=>{
  const sources={};
  const load=(name,source)=>{
    const module={exports:{}};
    source(module,key=>sources[key]);
    sources[name]=module.exports;
  };
  load('./catalog.js',(module,require)=>{ const startOfDemo = Date.UTC(new Date().getUTCFullYear(),0,1);
const day = 86400000;
const sites = [
  {id:'harbor',client:'c1',name:'Maple Junction Centre',area:'Brampton',uniform:'Black polo',notes:'Meet the fictional site lead at the east reception desk. Bring your guard licence and photo ID.'},
  {id:'cedar',client:'c2',name:'Cedar Square',area:'Mississauga',uniform:'Navy blazer',notes:'Check in at the fictional concierge desk. Ask for the site orientation sheet.'}
];
const clients = {c1:'Maple Property Group',c2:'Cedar Facilities'};
const firstNames = ['Avery','Robin','Casey','Jamie','Morgan','Taylor','Reese','Quinn','Jordan','Drew','Sage','Parker'];
const lastNames = ['Vale','Finch','Lane','Brooks','Reed','West','Blake','Shore','Fields','Hart'];
const guards = Array.from({length:1000},(_,i)=>({
  id:3001+i,name:`${firstNames[i%12]} ${lastNames[Math.floor(i/12)%10]+(i>=120?" "+(1+Math.floor(i/120)):"")}`,tier:i===2?0:i%9===0?2:1,
  licensedUntil:i===0?startOfDemo-day:startOfDemo+730*day,
  trained:[36,45,54].includes(i)?['harbor','cedar']:i===1?['cedar']:i<20?['harbor','cedar']:i%3===0?['cedar']:['harbor'],
  uniforms:[36,45,54].includes(i)?['Black polo','Navy blazer']:i===3?['Navy blazer']:i<20?['Black polo','Navy blazer']:i%3===0?['Navy blazer']:['Black polo'],
  eta:[36,45,54].includes(i)?21:i===4?185:i===15?37:i>=20?33+(i*7)%65:8+(i*3)%22,
  reliability:87+(i*7)%14,available:i!==5 && (i<31||i%4!==0)
}));

const areas=['Brampton','Mississauga','Vaughan','Toronto','Markham'];
for(let number=3;number<=100;number++){
  const client='c'+number;
  const area=areas[(number-3)%areas.length];
  clients[client]=area+' Facilities '+number;
  sites.push({id:'site'+number,client,area,name:area+' Plaza '+number,uniform:'Black polo',notes:'Report to reception with your guard licence and collect the site briefing.'});
}
for(const [i,g] of guards.entries()){
  for(let offset=0;offset<5;offset++)g.trained.push('site'+(3+(i+offset*19)%98));
  if(i>=120){
    g.eta=7+(i*17)%65;
    g.available=i%7!==0;
  }
  g.phone='+1-416-555-'+String(100+i%100).padStart(4,'0')+' ext '+g.id;
  g.reportRecord={reviewed:10,accepted:7+i%4,asOf:startOfDemo,basis:'Supervisor review for completeness and timely submission'};
  g.priorCancellations=i%4;
  g.onTime=18+(i*7)%13;
  g.completed=30;
  g.reliability=Math.round(100*g.onTime/g.completed);
}
if(typeof module!=='undefined')module.exports={sites,clients,guards};

 });
  load('./model.js',(module,require)=>{ const minute = 60000;
const hour = 60 * minute;
const day = 24 * hour;
const tiers = ['Guard','Tier 2','Supervisor'];
let {sites,clients,guards}=typeof module!=='undefined'?require('./catalog.js'):{sites:[],clients:{},guards:[]};

const guardId=id=>Number(id)>0&&Number(id)<=120?3000+Number(id):Number(id);
const weekdays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const blocks=['Morning','Afternoon','Overnight'];
const defaultPreferences={days:[...weekdays],blocks:[...blocks],maxHours:44,rush:true};

function migrate(snapshot) {
  if(snapshot.version===2)return snapshot;
  for(const r of snapshot.requests){
    for(const a of r.assignments)a.guard=guardId(a.guard);
    if(r.cancelledGuard)r.cancelledGuard=guardId(r.cancelledGuard);
    if(r.cancelledGuards)r.cancelledGuards=r.cancelledGuards.map(guardId);
    r.offers=Object.fromEntries(Object.entries(r.offers).map(([id,offer])=>[guardId(id),offer]));
  }
  for(const leave of snapshot.leaves)leave.guard=guardId(leave.guard);
  for(const swap of snapshot.swaps){
    swap.guard=guardId(swap.guard);
    if(swap.target)swap.target=guardId(swap.target);
  }
  snapshot.profiles={};
  snapshot.version=2;
  return snapshot;
}

function newRequest(id,site,when,length,need,tier,rush,notes='') {
  return {id,site,start:when,end:when+length,need,tier,rush,notes,offers:{},assignments:[],alertCount:0};
}

function seed(){
  const now=Date.now();
  const surge=newRequest(1,'harbor',now+2*hour,4*hour,10,1,true,'Additional entrance coverage for an evening event. Check in at east reception.');
  surge.supervisors=1;
  const lobby=newRequest(2,'cedar',now+30*minute,4*hour,1,2,false,'Supervisor must collect the access log at reception.');
  lobby.supervisors=1;
  lobby.assignments.push({guard:3019,post:'Supervisor',at:now-hour});
  const requests=[surge,lobby];
  for(const [index,site] of sites.slice(2).entries()){
    const start=now+(1+index%7)*day+(index%3)*hour;
    const post=newRequest(index+3,site.id,start,6*hour,2,0,false,'Scheduled lobby coverage.');
    const incumbents=guards.filter(g=>g.available&&g.licensedUntil>=post.end&&g.trained.includes(site.id)&&g.uniforms.includes(site.uniform)&&!requests.some(other=>overlaps(other,post)&&other.assignments.some(a=>a.guard===g.id)));
    for(const guard of incumbents.slice(0,index%4===0?1:2))post.assignments.push({guard:guard.id,post:'General',at:now});
    requests.push(post);
  }
  return {version:2,now,profiles:{},requests,leaves:[],swaps:[],next:101,log:[{at:now,message:'Weekly staffing requests received.'}]};
}

let data;
const view={role:'admin',selected:1,guard:null,client:null,contact:null,search:'',status:'all',page:0,template:null,prefill:{},checked:new Set()};

const byId=(id)=>data.requests.find(r=>r.id===Number(id));
const guardBy=(id)=>guards.find(g=>g.id===Number(id));
const siteBy=(id)=>sites.find(s=>s.id===id);
const dateFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'});const inputDate=n=>{const parts=Object.fromEntries(dateFmt.formatToParts(n).map(p=>[p.type,p.value]));return [parts.year,parts.month,parts.day].join('-');};
const calendarDate=(date,offset)=>new Date(Date.parse(date+'T12:00Z')+offset*day).toISOString().slice(0,10);
const clockFmt=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Toronto',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const inputTime=n=>clockFmt.format(n);
function localTime(date,time){const base=Date.parse(date+'T'+time+'Z');for(const offset of [4,5]){const t=base+offset*hour;if(Number.isFinite(t)&&inputDate(t)===date&&inputTime(t)===time)return t;}throw Error('Choose a valid Toronto local time.');}
const formatTime=(n)=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',hour:'numeric',minute:'2-digit',hour12:true}).format(n);
const formatDay=(n)=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',weekday:'short',month:'short',day:'numeric'}).format(n);
const shiftTime=(r)=>`${formatDay(r.start)} · ${formatTime(r.start)}–${inputDate(r.start)===inputDate(r.end)?'':formatDay(r.end)+' '}${formatTime(r.end)}`;
const open=(r)=>r.need-r.assignments.length;
const isPast=(r)=>r.start<=data.now;
const overlaps=(a,b)=>a.start<b.end&&b.start<a.end;
const safe=(val)=>String(val??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

function gap(r){return Math.max(0,(r.supervisors||0)-r.assignments.filter(a=>a.post==='Supervisor').length);}
const calendarCache=new WeakMap();
function requestCalendar(r){
  if(calendarCache.has(r))return calendarCache.get(r);
  const midnight=localTime(inputDate(r.start),'00:00');
  const dow=(new Date(inputDate(midnight)+'T12:00Z').getUTCDay()+6)%7;
  const dateAt=i=>new Date(Date.parse(inputDate(midnight)+'T12:00Z')+i*day).toISOString().slice(0,10);
  const monday=localTime(dateAt(-dow),'00:00'),weekEnd=localTime(dateAt(7-dow),'00:00');
  const bounds=Array.from({length:3},(_,i)=>localTime(dateAt(i),'00:00'));
  const calendar={monday,weekEnd,bounds};
  calendarCache.set(r,calendar);
  return calendar;
}
function scheduleCheck(g,r){
  const {monday,weekEnd,bounds}=requestCalendar(r);
  const duties=data.requests.filter(x=>r.id!==x.id&&x.assignments.some(a=>a.guard===g.id));
  const hours=duties.reduce((n,x)=>n+Math.max(0,Math.min(x.end,weekEnd)-Math.max(x.start,monday))/hour,0);
  const nextHours=duties.reduce((n,x)=>n+Math.max(0,Math.min(x.end,weekEnd+7*day)-Math.max(x.start,weekEnd))/hour,0);
  const firstWeek=hours+(Math.min(r.end,weekEnd)-r.start)/hour;
  const secondWeek=nextHours+Math.max(0,r.end-weekEnd)/hour;
  const crossesWeek=r.end>weekEnd;
  const projected=crossesWeek?Math.max(firstWeek,secondWeek):firstWeek;
  const overtime=Math.max(0,firstWeek-44)-Math.max(0,hours-44)+(crossesWeek?Math.max(0,secondWeek-44)-Math.max(0,nextHours-44):0);
  let rest=duties.some(x=>{const spacing=Math.max(x.start-r.end,r.start-x.end);return spacing>=0&&spacing<8*hour&&x.end-x.start+r.end-r.start>13*hour;});
  for(let d=0;d<2;d++){const start=bounds[d],end=bounds[d+1];if(r.end<=start)break;
    let cursor=start,longest=0;
    for(const x of [...duties,r].filter(x=>x.start<end&&x.end>start).sort((a,b)=>a.start-b.start)){longest=Math.max(longest,x.start-cursor);cursor=Math.max(cursor,Math.min(end,x.end));}

function eligibility(g,r,{forSwap=false}={}) {
  const site=siteBy(r.site);

  const reasons=[];
  if(!forSwap&&g.tier<2&&open(r)>0&&gap(r)>=open(r))reasons.push('Supervisor post required');
  if(r.force&&(g.id-3000)%6===0)reasons.push('MORB / use-of-force record missing');
  if(r.vehicle&&(g.id-3000)%3!==1)reasons.push('Vehicle authorization missing');
  const review=scheduleCheck(g,r);
  if(review.rest)reasons.push('Rest check failed');
  if(review.review)reasons.push('Schedule history needs review');
  if(g.licensedUntil<r.end) reasons.push('Licence expires before shift ends');
  if(g.tier<r.tier) reasons.push('Tier below site requirement');
  if(!g.trained.includes(site.id)) reasons.push('Site training missing');
  if(!g.uniforms.includes(site.uniform)) reasons.push('Required uniform unavailable');
  if((preferencesFor(g.id).unavailable||[]).some(window=>overlaps(window,r)))reasons.push('Unavailable during this period');
  if(!g.available) reasons.push('Marked unavailable');
  if(data.leaves.some(l=>l.guard===g.id&&l.status==='Approved'&&overlaps(l,r))) reasons.push('Approved leave');
  if(r.cancelledGuard===g.id||r.cancelledGuards?.includes(g.id)) reasons.push('Cancelled this shift');
  if(r.assignments.some(a=>a.guard===g.id)) reasons.push('Already assigned here');
  if(data.requests.some(other=>other.id!==r.id&&overlaps(r,other)&&other.assignments.some(a=>a.guard===g.id))) reasons.push('Overlapping assignment');
  if(remaining<=0) reasons.push('Shift already started');
  else if(travelMinutes(g,r)>remaining) reasons.push('Estimated arrival is too late');
  if(open(r)<=0&&!forSwap) reasons.push('All positions filled');

function travelMinutes(g,r){
  const site=siteBy(r.site);

}
const attendanceCache=new WeakMap();
function attendance(g){
  let index=attendanceCache.get(data);
  if(!index){
    index=new Map();
    for(const r of data.requests)for(const a of r.assignments||[]){
      if(!a.review)continue;
      const record=index.get(a.guard)||{onTime:0,completed:0};
      record.completed++;
      if(a.review.arrival==='On time')record.onTime++;
      index.set(a.guard,record);
    }
    attendanceCache.set(data,index);
  }
  const recorded=index.get(g.id);
  const onTime=g.onTime+(recorded?.onTime||0),completed=g.completed+(recorded?.completed||0);
  return {onTime,completed,rate:onTime/completed};
}
const sortedGuards=(r)=>[...guards].sort((a,b)=>r.rush?travelMinutes(a,r)-travelMinutes(b,r)||attendance(b).rate-attendance(a).rate:attendance(b).rate-attendance(a).rate||travelMinutes(a,r)-travelMinutes(b,r));
const audit=(message)=>data.log.unshift({at:data.now,message});
const offerFor=(r,g)=>r.offers[g.id];
const waiting=(r)=>Object.values(r.offers).filter(o=>o.status==='Volunteered').length;
const preferencesFor=(id)=>data.profiles[id]||defaultPreferences;
const activeOffer=(o)=>o?.status==='Invited'&&o.expires>data.now&&(!o.replyDeadline||o.replyDeadline>Date.now());

function preferenceMatches(g,r,projected) {

  const weekday=weekdays[(new Date(inputDate(r.start)+'T12:00Z').getUTCDay()+6)%7];

  const block=startHour>=6&&startHour<12?'Morning':startHour>=12&&startHour<18?'Afternoon':'Overnight';

function insist(condition,message) {if(!condition) throw new Error(message);}

function volunteer(r,g) {

  const failures=eligibility(g,r);
  insist(!failures.length,failures.join(' · '));
  r.offers[g.id]={...existing,status:'Volunteered',at:data.now};
  audit(`${g.name} volunteered for ${siteBy(r.site).name}.`);
  return 'Response sent. The shift appears on your schedule after administrator approval.';
}

function closeOffers(r) {
  for(const o of Object.values(r.offers)) if(['Invited','Volunteered'].includes(o.status)) o.status='Closed';
}

function recordEvent(r,status,guard){
  (r.history ||= []).push({at:data.now,status,guard});
}
function autoWave(r){
  if(r.rush&&open(r)>0&&!isPast(r)&&availableForWave(r).length)sendWave(r);
}
function assign(r,g) {

  insist(offerFor(r,g)?.status==='Volunteered','This guard has not volunteered.');
  r.assignments.push({guard:g.id,post:g.tier===2&&gap(r)?'Supervisor':'General',at:data.now});

function cancelAssignment(r,g,reason='Guard cancelled') {
  insist(!isPast(r),'This shift has already started.');
  const index=r.assignments.findIndex(a=>a.guard===g.id);
  insist(index!==-1,'This assignment is already open.');
  r.assignments.splice(index,1);
  for(const s of data.swaps)if(s.shift===r.id&&s.guard===g.id&&s.status==='Pending')s.status='Declined';
  r.cancelledGuards=[...new Set([...(r.cancelledGuards||[]),r.cancelledGuard,g.id].filter(Boolean))];
  r.cancelledGuard=g.id;
  for(const [id,o] of Object.entries(r.offers))if(o.status==='Closed')delete r.offers[id];
  if(offerFor(r,g)) offerFor(r,g).status='Cancelled';
  recordEvent(r,reason,g.id);
  r.replacement=true;
  r.rush ||= r.start-data.now<=2*hour;

function sendWave(r) {
  const pool=availableForWave(r);
  const specialists=pool.filter(g=>g.tier===2).slice(0,gap(r)*2);
  const ranked=[...specialists,...pool.filter(g=>!specialists.includes(g))];
  insist(pool.length,'No new eligible guards. Review the exclusions and escalate if needed.');
  const expires=Math.min(r.start,data.now+(r.rush?5:60)*minute);
  const invited=ranked.slice(0,Math.min(24,Math.max(3,2*open(r))));
  const replyDeadline=r.rush?Date.now()+expires-data.now:null;
  for(const g of invited) r.offers[g.id]={status:'Invited',at:data.now,expires,replyDeadline};

function eligibleSwaps(l) {
  const r=byId(l.shift);
  const assignment=r?.assignments.find(a=>a.guard===l.guard);
  if(!assignment||isPast(r))return [];
  return guards.filter(g=>(assignment.post!=='Supervisor'||g.tier===2)&&g.id!==l.guard&&!eligibility(g,r,{forSwap:true}).length);

function resolveChange(type,id,approve) {
  insist(type==='leave'||type==='swap','Choose a valid schedule change.');
  const item=(type==='leave'?data.leaves:data.swaps).find(x=>x.id===Number(id));
  insist(item?.status==='Pending','This item was already reviewed.');
  const g=guardBy(item.guard);
  if(approve&&type==='leave') {
    const affected=data.requests.filter(r=>!isPast(r)&&overlaps(item,r)&&r.assignments.some(a=>a.guard===g.id));
    for(const r of affected) cancelAssignment(r,g,'Released for approved leave');
    audit(`Leave approved for ${g.name}. ${affected.length} future shift positions reopened.`);
  }
  if(approve&&type==='swap') {
    const r=byId(item.shift);
    const index=r.assignments.findIndex(a=>a.guard===g.id);
    insist(index>=0,'The original assignment has changed.');
    insist(item.accepted,'The proposed guard must accept first.');
    insist(eligibleSwaps(item).some(x=>x.id===item.target),'The replacement no longer meets the shift requirements.');
    r.assignments[index]={guard:item.target,post:r.assignments[index].post,at:data.now};
    recordEvent(r,'Swap approved',item.target);
    audit(`Swap approved from ${g.name} to ${guardBy(item.target).name}.`);
  }
  if(!approve) audit(`${type==='swap'?'Swap':'Leave'} declined for ${g.name}.`);
  item.status=approve?'Approved':'Declined';
  return `${type==='swap'?'Swap':'Leave'} ${item.status.toLowerCase()}.`;
}

function reviewBatch(r) {
  const selected=sortedGuards(r).sort((a,b)=>Number(b.tier===2)-Number(a.tier===2)).filter(g=>view.checked.has(g.id)&&offerFor(r,g)?.status==='Volunteered');
  let approved=0;
  for(const g of selected) {
    if(eligibility(g,r).length) continue;
    assign(r,g);
    approved++;
  }
  view.checked.clear();
  return `${approved} approved · ${selected.length-approved} skipped · ${open(r)} positions still open.`;
}

function openRequest(r) {

function createRequest(form) {

function leaveRange(first,last,now,leaves) {

    const requests=data.requests.filter(r=>siteBy(r.site).client===account.client).map(r=>{
      const {id,site,start,end,need,tier,rush,notes,supervisors,force,vehicle,replacement,contact}=r;
      return {id,site,start,end,need,tier,rush,notes,supervisors,force,vehicle,replacement,contact,timeline:(r.history||[]).filter(e=>['Received','Seeking cover','Approved','Guard cancelled','Removed by dispatch','Released for approved leave','Revised shift listed','Rescheduled by dispatch'].includes(e.status)).map(e=>({at:e.at,status:['Guard cancelled','Removed by dispatch','Released for approved leave'].includes(e.status)?'Post reopened':e.status})),dress:r.dress,source:r.source,progress:!r.need?'Rescheduled':r.assignments.length===r.need?'Fully staffed':r.assignments.length?'Partially staffed':r.alertCount?'Seeking cover':'Listed for guards',updated:r.history?.at(-1)?.at,supervisorGap:gap(r),confirmed:r.assignments.length};
    });

  }

    const mine=r.assignments.find(a=>a.guard===g.id);
    const offer=offerFor(r,g);
    const invited=activeOffer(offer);

    const canVolunteer=(!offer&&(!r.rush||preferencesFor(g.id).rush)||invited)&&!eligibility(g,r).length;
    const pendingSwap=data.swaps.some(s=>s.shift===r.id&&s.guard===g.id&&s.status==='Pending');
    if(!(mine&&r.end>data.now)&&!invited&&!volunteered&&!canVolunteer)continue;
    const {area,uniform,name,notes}=siteBy(r.site);
    const location=mine?{area,uniform,name,notes,brief:r.notes,dress:r.dress}:{area,uniform,dress:r.dress};
    const peers=mine&&!pendingSwap?eligibleSwaps({shift:r.id,guard:g.id}).map(({id,name})=>({id,name})):[];
    requests.push({id:r.id,start:r.start,end:r.end,rush:r.rush,location,eta:travelMinutes(g,r),mine,offer:invited||volunteered?offer:null,canVolunteer,pendingSwap,peers});
  }
  const poolSwaps=data.swaps.filter(s=>s.status==='Pending'&&!s.target&&eligibleSwaps(s).some(peer=>peer.id===g.id)).map(s=>{
    const {start,end,site}=byId(s.shift);
    const {area,uniform}=siteBy(site);

  });

    peer:guardBy(s.target===g.id?s.guard:s.target)?.name

  view.checked.clear();
  return `${approved} approved · ${selected.length-approved} skipped · ${open(r)} positions still open.`;
}

function openRequest(r) {
  view.selected=r.id;
  view.checked.clear();
}

const adminActions={
  wave:sendWave,
  escalate:r=>{
    insist(open(r)>0,'This request is already staffed.');
    r.escalated=true;
    r.followUp={owner:view.contact,at:data.now,due:Math.max(data.now,Math.min(r.start,data.now+5*minute))};
    audit(view.contact+' took responsibility for follow-up at '+siteBy(r.site).name+'.');
    return 'You own the follow-up.';
  },
  approve:(r,_,extra)=>{assign(r,guardBy(extra));return 'Guard approved. Confirmation is visible in their guard view.';},
  batch:reviewBatch,
  cancel:(r,_,extra)=>{cancelAssignment(r,guardBy(extra),'Removed by dispatch');return 'The position is open again.';},
  'accept-change':(_,id,extra)=>resolveChange(extra,id,true),
  'deny-change':(_,id,extra)=>resolveChange(extra,id,false)
};

const guardActions={
  ack:r=>{const a=r.assignments.find(a=>a.guard===view.guard);insist(a&&r.end>data.now,'Current assignment required.');a.ack=data.now;audit(guardBy(view.guard).name+' acknowledged the site brief.');return 'Acknowledgment recorded.';},
  pool:r=>{insist(!isPast(r)&&r.assignments.some(a=>a.guard===view.guard),'Upcoming assignment required.');insist(!data.swaps.some(s=>s.shift===r.id&&s.guard===view.guard&&s.status==='Pending'),'There is already a pending swap for this assignment.');data.swaps.push({id:data.next++,shift:r.id,guard:view.guard,target:null,status:'Pending',accepted:false});recordEvent(r,'Swap requested',view.guard);audit('Swap opened to eligible peers.');return 'Pool open. Your assignment stays active until approval.';},
  claim:(_,id)=>{
    const s=data.swaps.find(x=>x.id===Number(id));
    insist(s&&s.status==='Pending'&&!s.target&&eligibleSwaps(s).some(x=>x.id===view.guard),'Swap unavailable.');
    s.target=view.guard;
    s.accepted=true;
    s.claimedFromPool=true;
    return 'Claim sent for approval.';
  },

  volunteer:(r)=>{
    const g=guardBy(view.guard);
    insist(!r.rush||(!offerFor(r,g)&&preferencesFor(g.id).rush)||activeOffer(offerFor(r,g)),'An active offer is required for this urgent shift.');
    return volunteer(r,g);
  },
  decline:(r)=>{
    const g=guardBy(view.guard);
    insist(activeOffer(offerFor(r,g)),'This offer is no longer active.');
    offerFor(r,g).status='Declined';recordEvent(r,'Rejected offer',g.id);
    audit(`${g.name} declined an offer.`);
    return 'Offer declined.';
  },
  'guard-cancel':(r)=>{cancelAssignment(r,guardBy(view.guard));return 'Cancellation recorded. Dispatch can now find cover.';},
  'accept-swap':(_,id)=>{
    const s=data.swaps.find(x=>x.id===Number(id)&&x.target===view.guard&&x.status==='Pending');
    insist(s,'This proposal is no longer available.');
    insist(eligibleSwaps(s).some(g=>g.id===view.guard),'You are no longer eligible for this shift.');
    s.accepted=true;
    audit(`${guardBy(view.guard).name} accepted a swap proposal.`);
    return 'Acceptance sent for administrator approval.';
  }
};

function createRequest(form) {
  const site=siteBy(form.get('site'));
  const start=localTime(form.get('date'),form.get('time'));
  const length=Number(form.get('hours'))*hour;
  const count=Number(form.get('count'));
  const tier=Number(form.get('tier'));
  insist(site?.client===view.client,'Choose a site belonging to this client.');
  insist(start>data.now,'Choose a start time after the current time.');
  insist(length>=hour/2&&length<=24*hour&&Number.isInteger(count)&&count>=1&&count<=120&&tiers[tier],'Check duration, guard count, and tier.');
  const r=newRequest(data.next++,site.id,start,length,count,tier,form.get('rush')==='urgent'||start-data.now<=2*hour,String(form.get('notes')||'').slice(0,400));
  r.contact=view.contact; r.dress=String(form.get('dress')||'').slice(0,160);r.source=['Phone','Email'].includes(form.get('source'))?form.get('source'):'Portal';
  r.supervisors=Number(form.get('supervisors')||0);insist(Number.isInteger(r.supervisors)&&r.supervisors>=0&&r.supervisors<=count,'Supervisor posts must fit inside total headcount.');r.force=Boolean(form.get('force'));r.vehicle=Boolean(form.get('vehicle'));
  data.requests.push(r);recordEvent(r,'Received');autoWave(r);
  openRequest(r);
  audit(`${clients[view.client]} submitted a ${r.rush?'rush':'regular'} request for ${count} guards.`);
  view.template=null;
  view.prefill={};
  return 'Request submitted. Coverage will update here as assignments are approved.';
}

function leaveRange(first,last,now,leaves) {
  insist(/^\d{4}-\d{2}-\d{2}$/.test(first)&&/^\d{4}-\d{2}-\d{2}$/.test(last)&&first>=inputDate(now)&&last>=first,'Choose valid leave dates.');
  const start=localTime(first,'00:00');
  localTime(last,'00:00');
  const end=localTime(calendarDate(last,1),'00:00');
  insist(!leaves.some(l=>l.status!=='Declined'&&overlaps(l,{start,end})),'An existing leave request overlaps those dates.');
  return {start,end};
}

function requestLeave(form) {
  const {start,end}=leaveRange(form.get('first'),form.get('last'),data.now,data.leaves.filter(l=>l.guard===view.guard));
  data.leaves.push({id:data.next++,guard:view.guard,start,end,status:'Pending'});
  audit(`${guardBy(view.guard).name} requested leave.`);
  return 'Leave sent for administrator review.';
}

function requestSwap(form,shift) {
  const r=byId(shift);
  const target=Number(form.get('target'));
  insist(r?.assignments.some(a=>a.guard===view.guard),'Only the assigned guard can propose a swap.');
  insist(eligibleSwaps({shift:r.id,guard:view.guard}).some(g=>g.id===target),'That guard is no longer eligible.');
  insist(!data.swaps.some(s=>s.shift===r.id&&s.guard===view.guard&&s.status==='Pending'),'There is already a pending swap for this assignment.');
  data.swaps.push({id:data.next++,shift:r.id,guard:view.guard,target,status:'Pending',accepted:false});
  recordEvent(r,'Swap requested',view.guard);audit(`${guardBy(view.guard).name} proposed a swap.`);
  return 'Swap proposed. Your assignment stays active while it is under review.';
}

function savePreferences(fields) {
  const {days,blocks:preferred,maxHours,rush}=fields;
  insist(Array.isArray(days)&&days.every(day=>weekdays.includes(day))&&Array.isArray(preferred)&&preferred.every(block=>blocks.includes(block)),'Choose valid working days and shift blocks.');
  insist(Number.isFinite(maxHours)&&maxHours>=1&&maxHours<=168&&typeof rush==='boolean','Choose a weekly hours target from 1 to 168.');
  data.profiles[view.guard]={...preferencesFor(view.guard),days:[...new Set(days)],blocks:[...new Set(preferred)],maxHours,rush};
  return 'Working preferences saved.';
}

function project(snapshot,account) {
  data=migrate(snapshot); data.now=Date.now();
  if(account.role==='admin')return {state:data,catalog:{sites,clients,guards}};
  if(account.role==='client'){
    const clientSites=sites.filter(site=>site.client===account.client);
    const requests=data.requests.filter(r=>siteBy(r.site).client===account.client).map(r=>{
      const {id,site,start,end,need,tier,rush,notes,supervisors,force,vehicle,replacement,contact}=r;
      return {id,site,start,end,need,tier,rush,notes,supervisors,force,vehicle,replacement,contact,timeline:(r.history||[]).filter(e=>['Received','Seeking cover','Approved','Guard cancelled','Removed by dispatch','Released for approved leave','Revised shift listed','Rescheduled by dispatch'].includes(e.status)).map(e=>({at:e.at,status:['Guard cancelled','Removed by dispatch','Released for approved leave'].includes(e.status)?'Post reopened':e.status})),dress:r.dress,source:r.source,progress:!r.need?'Rescheduled':r.assignments.length===r.need?'Fully staffed':r.assignments.length?'Partially staffed':r.alertCount?'Seeking cover':'Listed for guards',updated:r.history?.at(-1)?.at,supervisorGap:gap(r),confirmed:r.assignments.length};
    });
    return {state:{now:data.now,requests},catalog:{sites:clientSites,clients:{[account.client]:clients[account.client]},guards:[]}};
  }
  const g=guardBy(account.guard);
  const requests=[];
  for(const r of data.requests){
    const mine=r.assignments.find(a=>a.guard===g.id);
    const offer=offerFor(r,g);
    const invited=activeOffer(offer);
    const volunteered=offer?.status==='Volunteered'&&!isPast(r);
    const canVolunteer=(!offer&&(!r.rush||preferencesFor(g.id).rush)||invited)&&!eligibility(g,r).length;
    const pendingSwap=data.swaps.some(s=>s.shift===r.id&&s.guard===g.id&&s.status==='Pending');
    if(!(mine&&r.end>data.now)&&!invited&&!volunteered&&!canVolunteer)continue;
    const {area,uniform,name,notes}=siteBy(r.site);
    const location=mine?{area,uniform,name,notes,brief:r.notes,dress:r.dress}:{area,uniform,dress:r.dress};
    const peers=mine&&!pendingSwap?eligibleSwaps({shift:r.id,guard:g.id}).map(({id,name})=>({id,name})):[];
    requests.push({id:r.id,start:r.start,end:r.end,rush:r.rush,location,eta:travelMinutes(g,r),mine,offer:invited||volunteered?offer:null,canVolunteer,pendingSwap,peers});
  }
  const poolSwaps=data.swaps.filter(s=>s.status==='Pending'&&!s.target&&eligibleSwaps(s).some(peer=>peer.id===g.id)).map(s=>{
    const {start,end,site}=byId(s.shift);
    const {area,uniform}=siteBy(site);
    return {id:s.id,start,end,location:{area,uniform}};
  });
  const swaps=data.swaps.filter(s=>s.guard===g.id||s.target===g.id).map(s=>({
    id:s.id,start:byId(s.shift).start,status:s.status,incoming:s.target===g.id,accepted:s.accepted,claimedFromPool:s.claimedFromPool,
    peer:guardBy(s.target===g.id?s.guard:s.target)?.name
  }));
  const notices=data.requests.flatMap(r=>(r.history||[]).filter(e=>e.guard===g.id&&['Removed by dispatch','Rescheduled by dispatch','Released for approved leave'].includes(e.status)).map(e=>({at:e.at,status:e.status,site:siteBy(r.site).name,start:r.start}))).sort((a,b)=>b.at-a.at).slice(0,5);
  const state={now:data.now,notices,requests,poolSwaps,swaps,leaves:data.leaves.filter(l=>l.guard===g.id),profile:preferencesFor(g.id),eta:g.eta};
  return {state,catalog:{sites:[],clients:{},guards:[]}};
}

if(typeof module!=='undefined') module.exports={
  seed,migrate,project,
  execute(snapshot, command, account) {
    data=migrate(structuredClone(snapshot)); data.now=Date.now();
    const {role,client,guard,name:contact}=account;
    const {action,id,extra,fields={}}=command;
    Object.assign(view,{role,client,guard,contact,checked:new Set(role==='admin'&&Array.isArray(command.checked)?command.checked:[])});
    const form=new Map(Object.entries(fields));
    const shift=byId(id);
    let message;
    if(role==='admin'&&action==='adjust-assignment'){
      const g=guardBy(extra);
      const assigned=shift?.assignments.find(a=>a.guard===g?.id);
      insist(assigned&&!isPast(shift),'Upcoming assignment required.');
      const start=localTime(fields.date,fields.time),duration=Number(fields.hours)*hour;
      insist(start>data.now&&duration>=hour/2&&duration<=24*hour,'Choose a future start and a valid duration.');
      insist(start!==shift.start||start+duration!==shift.end,'Choose a different time or duration.');
      const moved=newRequest(data.next++,shift.site,start,duration,1,shift.tier,start-data.now<=2*hour,shift.notes);
      Object.assign(moved,{dress:shift.dress,force:shift.force,vehicle:shift.vehicle,contact:shift.contact,source:shift.source,supervisors:Number(assigned.post==='Supervisor')});
      shift.assignments=shift.assignments.filter(a=>a!==assigned);
      shift.need--;shift.supervisors=Math.max(0,(shift.supervisors||0)-moved.supervisors);
      if(shift.offers[g.id])shift.offers[g.id].status='Rescheduled';
      for(const swap of data.swaps)if(swap.shift===shift.id&&swap.guard===g.id&&swap.status==='Pending')swap.status='Declined';
      recordEvent(shift,'Rescheduled by dispatch',g.id);
      data.requests.push(moved);recordEvent(moved,'Revised shift listed',g.id);
      if(!eligibility(g,moved).length&&(!moved.rush||preferencesFor(g.id).rush)){
        const expires=Math.min(start,data.now+(moved.rush?5:60)*minute);
        moved.offers[g.id]={status:'Invited',at:data.now,expires,replyDeadline:moved.rush?expires:null};
      }
      autoWave(moved);openRequest(moved);audit(view.contact+' revised the post for '+g.name+'. Fresh acceptance required.');
      message='Revised shift listed for fresh acceptance.';
    }else if(role==='admin'&&action==='review-duty'){
      const assignment=shift?.assignments.find(a=>a.guard===Number(extra));
      insist(assignment&&shift.end<=data.now,'Choose a completed assignment.');
      insist(['On time','Late'].includes(fields.arrival)&&['Accepted','Needs correction'].includes(fields.report),'Choose attendance and report outcomes.');
      insist(typeof fields.note==='string'&&fields.note.trim(),'Enter the review basis.');
      assignment.review={arrival:fields.arrival,report:fields.report,note:String(fields.note||'').slice(0,200),by:contact,at:data.now};
      recordEvent(shift,'Duty review saved',Number(extra));
      message='Duty record saved.';
    }else if(role==='admin'&&action==='call-note'){
      const g=guardBy(extra);
      insist(shift&&g&&['No answer','Unavailable','Will review offer'].includes(fields.outcome),'Choose a guard and outcome.');
      recordEvent(shift,fields.outcome,g.id);audit(view.contact+' logged phone follow-up with '+g.name+': '+fields.outcome);
      message='Follow-up recorded.';
    }else if(role==='client'&&action==='create-request') message=createRequest(form);
    else if(role==='guard'&&action==='leave-request') message=requestLeave(form);
    else if(role==='guard'&&action==='swap-request') message=requestSwap(form,id);
    else if(role==='guard'&&action==='unavailable'){
      const start=localTime(fields.date,fields.from),end=localTime(fields.endDate,fields.to);
      insist(start<end&&end>data.now,'Choose an unavailable period ending in the future.');
      const profile=preferencesFor(guard);
      insist(!data.requests.some(r=>r.assignments.some(a=>a.guard===guard)&&overlaps(r,{start,end})),'An assigned shift overlaps. Request a swap or report the cancellation first.');
      const windows=(profile.unavailable||[]).filter(w=>w.end>data.now);
      insist(!windows.some(w=>overlaps(w,{start,end})),'An unavailable period already overlaps these dates.');
      data.profiles[guard]={...profile,unavailable:[...windows,{start,end}]};message='Unavailable period saved.';
    }else if(role==='guard'&&action==='remove-window'){
      const profile=preferencesFor(guard);
      data.profiles[guard]={...profile,unavailable:(profile.unavailable||[]).filter(w=>w.start!==Number(id))};message='Unavailable period removed.';
    }else if(role==='guard'&&action==='preferences') message=savePreferences(fields);
    else{
      const actions=role==='admin'?adminActions:role==='guard'?guardActions:{};
      insist(Object.hasOwn(actions,action),'Unavailable action.');
      if(action==='advance') insist(Number(id)===5,'Choose a five minute step.');
      if(['cancelSupervisor','fast','wave','replies','escalate','approve','batch','cancel','ack','pool','volunteer','decline','guard-cancel'].includes(action))insist(shift,'Shift unavailable.');
      if(['approve','cancel'].includes(action))insist(guardBy(extra),'Unknown guard.');
      message=actions[action](shift,id,extra);
    }
    return {state:data,message,selected:view.selected,checked:[...view.checked]};
  }
};


const button=(label,action,id='',extra='',style='')=>`<button type="button" class="button ${style}" data-action="${action}" data-id="${id}" data-extra="${extra}">${label}</button>`;
const tag=(label,style='')=>`<span class="tag ${style}">${label}</span>`;
const empty=(label)=>`<div class="empty">${label}</div>`;
const option=(value,label,selected)=>`<option value="${safe(value)}"${value===selected?' selected':''}>${safe(label)}</option>`;
const confirmedCount=r=>r.confirmed??r.assignments.length;
const statusOf=(r)=>r.need===0?tag('Rescheduled'):confirmedCount(r)===r.need?tag('Covered','good'):isPast(r)?tag('Coverage missed','rush'):r.replacement?tag('Replacement','rush'):r.rush?tag('Urgent','rush'):tag('Open');
const meter=(r)=>`<div class="progress" role="progressbar" aria-label="Confirmed guards" aria-valuenow="${confirmedCount(r)}" aria-valuemax="${r.need}"><div style="width:${r.need?100*confirmedCount(r)/r.need:0}%"></div></div>`;
const coverage=(r)=>`${confirmedCount(r)} of ${r.need} confirmed`;
const requestsForClient=()=>data.requests.filter(r=>siteBy(r.site).client===view.client);

function hero(role,title,description) {
  return `<div class="hero"><div><p class="eyebrow">${role}</p><h1>${title}</h1><p class="muted">${description}</p></div></div>`;
}

function render() {
  document.querySelector('#account').innerHTML=`<span>${safe(account.name)} · ${account.id}</span>${button('Sign out','logout')}`;
  const command=document.querySelector('#command');
  command.innerHTML='<span class="small muted">Toronto time</span><span class="clock">'+formatTime(Date.now())+'</span>';
  document.querySelector('#screen').innerHTML=({admin:adminView,guard:guardView,client:clientView})[view.role]();if(view.role==='client')priority();
  renderChat();
  updateRushCountdown();
}

function priority(){const f=document.querySelector('#create-request')?.elements;if(!f)return;let note='';try{const diff=localTime(f.date.value,f.time.value)-data.now;note=diff<=0?'Choose a future start.':diff<=2*hour?'Starts within two hours. Automatically flagged as urgent.':f.rush.value==='urgent'?'Urgent dispatch requested.':'Regular dispatch.';}catch{}document.querySelector('#priority-note').textContent=note;}
document.addEventListener('input',priority);
function announce(message,error=false) {
  document.querySelector('#notice').innerHTML=message?`<p class="notice${error?' error':''}">${safe(message)}</p>`:'';
}

function adminView() {
  const active=data.requests.filter(r=>!isPast(r));
  const metrics=[['Open positions',active.reduce((sum,r)=>sum+open(r),0)],['Urgent requests',active.filter(r=>r.rush&&open(r)).length],['Awaiting review',active.reduce((sum,r)=>sum+waiting(r),0)+[...data.leaves,...data.swaps].filter(x=>x.status==='Pending').length]];
  const r=byId(view.selected);
  return `${hero('Administrator','Dispatch board','Review coverage, approve assignments, and manage schedule changes.')}
    <div class="stats secondary-metrics">${metrics.map(([label,value])=>`<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join('')}</div>
    ${weekBoard()}<div class="grid dispatch-grid ${view.mobileDetail?"detail-open":""}"><div class="queue-column"><section class="card"><div class="section-top"><h2>Coverage queue</h2><select id="status-filter" aria-label="Filter coverage">${option('all','All requests',view.status)}${option('open','Open',view.status)}${option('rush','Urgent',view.status)}${option('covered','Covered',view.status)}</select></div><input type="search" id="queue-search" placeholder="Search sites" aria-label="Search sites" value="${safe(view.search)}"><div class="stack" id="queue-results" style="margin-top:10px">${queueResults()}</div></section>${changePanel()}</div>
    <div class="request-column">${button("Back to queue","back-queue","","","mobile-back")}<div id="decision">${r?requestPanel(r):empty('Select a request to review coverage.')}</div>${activityPanel()}</div></div>`;
}

function queueDecision(r){
  if(!r.need)return 'Rescheduled';
  if(!open(r))return r.assignments.filter(a=>!a.ack).length+' briefs unread';
  if(isPast(r))return 'Coverage missed';
  const offers=Object.values(r.offers);
  if(waiting(r))return waiting(r)+' awaiting review';
  if(offers.some(activeOffer))return 'Awaiting guard replies';
  if(offers.some(o=>o.status==='Invited'))return 'Wave expired · follow up';
  return gap(r)?gap(r)+' supervisor needed':open(r)+' positions open';
}

function queueResults() {
  const list=data.requests.filter(r=>{
    const statusMatches=view.status==='all'||view.status==='open'&&open(r)||view.status==='rush'&&r.rush&&open(r)||view.status==='covered'&&!open(r);
    return statusMatches&&siteBy(r.site).name.toLowerCase().includes(view.search.toLowerCase());
  }).sort((a,b)=>Number(Boolean(open(b)&&b.rush&&!isPast(b)))-Number(Boolean(open(a)&&a.rush&&!isPast(a)))||a.start-b.start);
  const pageSize=6;
  const offset=view.page*pageSize;
  if(!list.length) return empty('No requests match these filters.');
  return list.slice(offset,offset+pageSize).map(r=>`<button type="button" class="list-button" data-action="select" data-id="${r.id}" aria-pressed="${r.id===view.selected}"><span class="row"><strong>${siteBy(r.site).name}</strong>${statusOf(r)}</span><span class="row muted small"><span>${formatDay(r.start)} · ${formatTime(r.start)}</span><span>${coverage(r)}</span></span><strong class="small">${queueDecision(r)}</strong> ${r.followUp&&open(r)?'<span class="small">Follow-up: '+safe(r.followUp.owner)+' · '+(r.followUp.due<=data.now?'due now':formatTime(r.followUp.due))+'</span>':''}</button>`).join('')+(list.length>pageSize?`<div class="row small muted"><span>${offset+1}–${Math.min(offset+pageSize,list.length)} of ${list.length}</span><span class="actions">${view.page?button('Previous','page',-1):''}${offset+pageSize<list.length?button('Next','page',1):''}</span></div>`:'');
}

function requestPanel(r) {
  const site=siteBy(r.site);
  const remaining=Math.floor((r.start-data.now)/minute);
  const pool=availableForWave(r);
  if(gap(r))pool.sort((a,b)=>Number(b.tier===2)-Number(a.tier===2));
  const preferred=pool.filter(g=>preferenceMatches(g,r,scheduleCheck(g,r).projected)).length;
  const volunteers=sortedGuards(r).filter(g=>offerFor(r,g)?.status==='Volunteered');
  const sent=Object.values(r.offers).filter(o=>o.expires).length;
  const invited=Object.values(r.offers).filter(activeOffer).length;
  const selected=volunteers.filter(g=>view.checked.has(g.id));
  const unread=r.assignments.filter(a=>!a.ack).length;
  const outstanding=Object.values(r.offers).filter(activeOffer);
  const deadline=outstanding.length?Math.min(...outstanding.map(o=>Math.min(o.expires,o.replyDeadline||Infinity))):0;
  const expired=Object.values(r.offers).some(o=>o.status==='Invited'&&!activeOffer(o));
  const reviewable=volunteers.filter(g=>!eligibility(g,r).length);
  const headline=!open(r)?(unread?unread+' site brief'+(unread===1?'':'s')+' awaiting acknowledgment':'All assigned guards acknowledged the brief'):isPast(r)?'Shift started with a vacancy':reviewable.length?'Review '+reviewable.length+' volunteer'+(reviewable.length===1?'':'s'):invited?'Waiting for replies until '+formatTime(deadline):expired?'Wave expired · 0 active replies':gap(r)?gap(r)+' supervisor needed':open(r)+' positions to fill';
  const blocker=r.escalated?(r.followUp?'Follow-up owned by '+safe(r.followUp.owner)+' · '+(r.followUp.due<=data.now?'due now':'due by '+formatTime(r.followUp.due)):'Manual follow-up flagged · owner needed.'):!open(r)?'Coverage complete. Confirmed guards can see site instructions.':isPast(r)?'Shift started with unfilled positions.':!pool.length&&!invited&&!volunteers.length?'No eligible replies or new guards. Take follow-up.':'';

function parseRequestDraft(msg) {
  const count=msg.match(/\b(\d+)\s*(?:extra\s+)?(?:guards?|people|guys)\b/i);
  const supervisors=msg.match(/\b(\d+)\s*supervisors?\b/i);
  const time=msg.match(/\b(?:at|by|from)\s+(1[0-2]|0?[1-9])(?::([0-5]\d))?\s*(am|pm)\b/i);
  const duration=msg.match(/\bfor\s+(\d+(?:\.\d+)?)\s*hours?\b/i);
  const relative=msg.match(/\bin\s+(\d+(?:\.\d+)?|[a-z]+)\s+hours?\b/i);
  const hourWords=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
  const amount=relative?.[1].toLowerCase()||'0';
  const delay=/^\d/.test(amount)?Number(amount):hourWords.indexOf(amount);
  const relativeStart=new Date(Math.ceil((data.now+delay*hour)/minute)*minute);
  const useRelative=!time&&delay>0&&Number.isFinite(relativeStart.getTime());
  const words=new Set(msg.toLowerCase().match(/[a-z]+/g));
  const mentioned=sites.filter(site=>words.has(site.name.split(' ')[0].toLowerCase())||words.has(site.area.toLowerCase()));
  const [site]=mentioned;
  return {
    site:mentioned.length===1?site.id:'',
    count:count?.[1]||'',
    supervisors:supervisors?.[1]||0,
    hours:duration?.[1]||'',
    date:useRelative?inputDate(relativeStart):words.has('tomorrow')?inputDate(data.now+day):words.has('today')?inputDate(data.now):'',
    time:useRelative?inputTime(relativeStart):time?String(Number(time[1])%12+(time[3].toLowerCase()==='pm'?12:0)).padStart(2,'0')+':'+(time[2]||'00'):'',
    tier:0,
    force:/\b(?:use[\s-]+of[\s-]+force|morb)\b/i.test(msg),
    vehicle:/\b(?:vehicles?|lock[\s-]?box(?:es)?|mobile patrol)\b/i.test(msg),
    rush:'regular'
  };
}

function extractEmailDraft(msg,fields) {
  const draft=parseRequestDraft(msg);fields.source.value="Email";
  for(const key of ['site','count','supervisors','hours','date','time'])fields[key].value=draft[key];
  fields.force.checked=draft.force;
  fields.vehicle.checked=draft.vehicle;
  priority();
  announce(draft.site?'Draft extracted. Review before submitting.':'Choose a site for this account and review the extracted draft.');
}

document.addEventListener('click',event=>{
  const target=event.target.closest('button[data-action]');
  if(!target) return;
  const {action,id,extra}=target.dataset;
  if(action==='logout'){signOut();return;}
  if(!account)return;
  if(handleChatAction(action,id))return;
  if(action==='guard-tab'){view.guardTab=id;render();window.scrollTo(0,0);document.querySelector(`[data-action=guard-tab][data-id="${id}"]`)?.focus();return;}
  if(action==='alert-device'&&view.role==='guard'){toggleRushSound();return;}
  const r=byId(id);
  if(action==='extract'&&view.role==='client'){
    extractEmailDraft(document.querySelector('#email').value,document.querySelector('#create-request').elements);
    return;
  }
  if(action==='week'){view.weekOpen=true;view.weekOffset=(view.weekOffset||0)+Number(id);render();return;}
  if(action==='cancel'&&!confirm('Remove this assignment and reopen the post?'))return;
  if(action==='remove-window'){submitAction(action,id);return;}
  if(action==='phone-alert'){managePhoneAlerts();return;}
  if(action==='reset'){if(confirm('Reset to the original fictional scenario?')) submitAction('reset','',data.scenario);return;}
  if(action==='jump-review'){document.querySelector('#volunteer-review')?.focus();return;}
  if(action==='jump-briefs'){const details=document.querySelector('#assigned-briefs');if(details){details.open=true;details.querySelector('summary').focus();}return;}
  if(action==='back-queue'){view.mobileDetail=false;render();document.querySelector('[data-action="select"][aria-pressed="true"]')?.focus();return;}
  if(action==='select'&&r){view.mobileDetail=true;openRequest(r);render();announce('');return;}
  if(action==='page'){view.page+=Number(id);document.querySelector('#queue-results').innerHTML=queueResults();return;}
  if(action==='repeat'&&r&&view.role==='client'&&requestsForClient().includes(r)){
    view.template=r.id;
    view.prefill={dress:r.dress,supervisors:r.supervisors,force:r.force,vehicle:r.vehicle,site:r.site,tier:r.tier,hours:(r.end-r.start)/hour,count:r.need,rush:'regular',notes:r.notes};
    render();document.querySelector('#create-request input').focus();return;
  }
  if(action==='clear-template'){view.template=null;view.prefill={};render();return;}
  const actions=view.role==='admin'?adminActions:view.role==='guard'?guardActions:{};
  const special=action==='accept-change'&&extra==='swap'?byId(data.swaps.find(x=>x.id===Number(id))?.shift):r;
  if(['approve','batch','accept-change'].includes(action)&&(special?.vehicle||special?.force)&&!confirm('Have you verified the special post requirements and selected credentials?'))return;
  if(Object.hasOwn(actions,action)) submitAction(action,id,extra);
});

document.addEventListener('submit',event=>{
  event.preventDefault();
  const form=event.target;
  if(form.id==='login'){signIn(form);return;}
  if(!account)return;
  const values=new FormData(form);
  if(form.id==='find-record'){const g=guardBy(Number(values.get('guard')));if(!g){announce('Unknown guard ID.',true);return;}view.recordGuard=g.id;view.recordOpen=true;render();return;}
  if(form.id==='review-duty'){submitAction('review-duty',form.dataset.request,form.dataset.guard,Object.fromEntries(values));return;}
  if(form.id==='call-log'){submitAction('call-note',form.dataset.request,form.dataset.guard,Object.fromEntries(values));return;}
  if(form.id==='adjust-form'){submitAction('adjust-assignment',form.dataset.request,values.get('guard'),Object.fromEntries(values));return;}
  if(form.id==='chat-form'){
    const prompt=String(values.get('prompt')).trim();
    if(prompt){form.reset();askSigma(prompt);}
    return;
  }
  if(form.id==='unavailable'){submitAction('unavailable','','',Object.fromEntries(values));return;}
  if(form.id==='preferences'){
    submitAction('preferences','','',{days:values.getAll('days'),blocks:values.getAll('blocks'),maxHours:Number(values.get('maxHours')),rush:values.has('rush')});
    return;
  }
  submitAction(form.dataset.swap?'swap-request':form.id,form.dataset.swap||'','',Object.fromEntries(values));
});

const requestApi=typeof standaloneRequest==='function'?standaloneRequest:fetch;
const roleTitles={admin:'Dispatch Admin',client:'Client Portal',guard:'Guard Account'};
const apiOptions=body=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let account=null, revision=-1, busy=false, generation=0;

document.addEventListener('input',event=>{

  input.inputMode=numbered?'numeric':'text';

async function signIn(form) {
  if(busy)return;
  busy=true;
  const control=form.querySelector('button');
  control.disabled=true;
  try{
    const response=await requestApi('/api/login',apiOptions(Object.fromEntries(new FormData(form))));
    if(!response.ok)throw Error((await response.json()).error);
    announce('');
  }catch(error){announce(error.message,true);}
  finally{busy=false;control.disabled=false;await refresh();}
}

async function signOut() {
  if(busy)return;
  busy=true;
  try{
    const response=await requestApi('/api/logout',apiOptions({}));
    if(!response.ok)throw Error((await response.json()).error);
    showLogin();
    announce('');
    document.querySelector('#login-name').focus();
  }catch(error){announce(error.message,true);}
  finally{busy=false;}
}

function install(record) {
  if(account?.id!==record.account.id){
    view.checked.clear();
    resetChat();
    Object.assign(view,{mobileDetail:false,selected:1,search:'',status:'all',page:0,template:null,prefill:{},guardTab:'shifts',scheduleMode:'Agenda',calendarDate:null});
  }
  account=record.account;
  Object.assign(view,{role:account.role,guard:account.guard,client:account.client});
  ({sites,clients,guards}=record.catalog);
  data=record.state;
  revision=record.revision;
  if(!byId(view.selected))view.selected=data.requests[0]?.id;
}

async function submitAction(action,id='',extra='',fields={}) {
  if(busy||!account)return false;
  busy=true;
  let completed=false;
  try{
    const response=await requestApi('/api/actions',apiOptions({revision,account:account.id,checked:[...view.checked],action,id,extra,fields}));
    const result=await response.json();
    if(response.status===401)showLogin();
    if(!response.ok)throw Error(result.error);
    install(result);
    if(action==='adjust-assignment'||action==='create-request'||action==='reset')view.selected=result.selected;
    if(action==='create-request'){view.template=null;view.prefill={};}
    view.checked=new Set(result.checked);
    render();
    announce(result.message);
    completed=true;
  }catch(error){announce(error.message,true);}
  finally{busy=false;refresh();}
  return completed;
}

async function refresh() {
  if(busy)return;
  const before=generation;
  try{
    const reply=await requestApi('/api/state?since='+revision+'&account='+(account?.id||''),{cache:'no-store'});
    if(busy||generation!==before||reply.status===204)return;
    if(reply.status===401){if(account||!document.querySelector('#login'))showLogin();return;}
    if(!reply.ok)throw Error('Schedule unavailable.');
    const record=await reply.json();
    if(busy||generation!==before||record.account.id===account?.id&&record.revision<=revision)return;
    const selector='#screen form input,#screen form textarea,#screen form select,#email';
    const drafts=record.account.id===account?.id?[...document.querySelectorAll(selector)].map(el=>({
      id:el.id,name:el.name,form:el.form?.id||el.form?.dataset.swap,kind:el.type,value:el.value,checked:el.checked,
      focused:el===document.activeElement,start:el.selectionStart,end:el.selectionEnd
    })):[];
    const openDetails=[...document.querySelectorAll('#screen details[open]')].map(el=>el.id).filter(Boolean);
    const emailOpen=document.querySelector('#email')?.closest('details').open;
    install(record);
    render();
    const fields=[...document.querySelectorAll(selector)];
    for(const draft of drafts){
      const el=fields.find(input=>draft.id?input.id===draft.id:(input.form?.id||input.form?.dataset.swap)===draft.form&&input.name===draft.name&&(draft.kind!=='checkbox'||input.value===draft.value));
      if(!el)continue;
      if(el.type==='checkbox')el.checked=draft.checked;
      else el.value=draft.value;
      if(draft.focused){
        el.focus({preventScroll:true});
        if(draft.start!==null&&typeof el.setSelectionRange==='function')el.setSelectionRange(draft.start,draft.end);
      }
    }
    for(const id of openDetails){const details=document.getElementById(id);if(details)details.open=true;}
    if(emailOpen&&drafts.length)document.querySelector('#email')?.closest('details').setAttribute('open','');
    if(view.role==='client')priority();
  }catch{
    if(!account&&!document.querySelector('#login'))showLogin();
    announce(typeof standaloneRequest==='function'?'Browser storage is unavailable. Check your browser settings and reopen this file.':'Connection interrupted. Reconnecting to Sigma Dispatch…',true);
  }
}

function startApp() {
  showLogin();
  refresh();
  setInterval(refresh,1500);
  setInterval(()=>{
    if(!data)return;
    const oldTime=data.now;
    data.now=Date.now();
    if(view.role==='admin'){
      const crossed=t=>t>oldTime&&t<=data.now;
      const due=data.requests.some(r=>crossed(r.start)||crossed(r.followUp?.due)||Object.values(r.offers).some(o=>crossed(Math.min(o.expires,o.replyDeadline||Infinity))));
      const request=byId(view.selected);
      if(request&&(due||Math.floor((request.start-oldTime)/minute)!==Math.floor((request.start-data.now)/minute))){
        const decision=document.querySelector('#decision');
        const opened=[...decision.querySelectorAll('details[open]')].map(el=>el.id);
        const focused=document.activeElement;
        const selector=decision.contains(focused)&&focused.dataset.action?'button[data-action="'+focused.dataset.action+'"][data-extra="'+focused.dataset.extra+'"]':null;
        const drafts=[...decision.querySelectorAll('form[id] input,form[id] select')].map(el=>({form:el.form.id,name:el.name,value:el.value,focused:el===focused}));
        decision.innerHTML=requestPanel(request);
        for(const draft of drafts){
          const el=document.getElementById(draft.form)?.elements.namedItem(draft.name);
          if(el){el.value=draft.value;if(draft.focused)el.focus({preventScroll:true});}
        }
        for(const id of opened){const el=document.getElementById(id);if(el)el.open=true;}
        if(selector)decision.querySelector(selector)?.focus({preventScroll:true});
        document.querySelector('#queue-results').innerHTML=queueResults();
        const active=data.requests.filter(r=>!isPast(r));
        const metrics=document.querySelectorAll('.metric strong');
        metrics[0].textContent=active.reduce((sum,r)=>sum+open(r),0);
        metrics[1].textContent=active.filter(r=>r.rush&&open(r)).length;
        metrics[2].textContent=active.reduce((sum,r)=>sum+waiting(r),0)+[...data.leaves,...data.swaps].filter(x=>x.status==='Pending').length;
      }
    }
    const clock=document.querySelector('.clock');
    if(clock)clock.textContent=formatTime(data.now);
    updateRushCountdown();
  },1000);
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

let alertGuard=null, alertAudio=null, seenRush=new Set();
function toggleRushSound() {
  if(alertGuard===account.id){alertGuard=null;render();return;}
  alertGuard=account.id;
  seenRush=new Set(rushOffers().map(r=>r.id+':'+r.offer.replyDeadline));
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(Audio){
    try{alertAudio ||= new Audio();alertAudio.resume().catch(()=>{});}catch{}
  }
  render();
}
function signalRush() {
  if(!account||view.role!=='guard'||alertGuard!==account.id)return;
  for(const r of rushOffers()){
    const key=r.id+':'+r.offer.replyDeadline;
    if(seenRush.has(key))continue;
    seenRush.add(key);
    const banner=document.querySelector('.rush-banner');
    if(banner && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      banner.animate([{outline:'4px solid transparent'},{outline:'4px solid #d88600'},{outline:'4px solid transparent'}],{duration:1600,iterations:2});
    }
    navigator.vibrate?.([180,80,180]);
    if(alertAudio?.state==='running'){
      const oscillator=alertAudio.createOscillator();
      const gain=alertAudio.createGain();
      oscillator.frequency.value=625;
      gain.gain.value=.09;
      oscillator.connect(gain).connect(alertAudio.destination);
      oscillator.start();
      oscillator.stop(alertAudio.currentTime+.20);
    }
  }
}
async function managePhoneAlerts(){
  try{
    const disable=data.phoneRegistered&&Notification.permission==='granted';
    if(!disable&&await Notification.requestPermission()!=='granted')throw Error('Phone notifications are off. To enable them, allow notifications in browser settings.');
    const registration=await navigator.serviceWorker.ready;
    let subscription=await registration.pushManager.getSubscription();
    if(disable){
      const removed=await requestApi('/api/push',apiOptions({endpoint:null}));
      if(!removed.ok)throw Error('Could not turn off phone alerts.');
      await subscription?.unsubscribe();
      await refresh();return;
    }
    if(!subscription){
      const response=await fetch('/api/push');
      if(!response.ok)throw Error('Sign in again to enable notifications.');
      const {publicKey}=await response.json();
      subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:publicKey});
    }
    const saved=await requestApi('/api/push',apiOptions({endpoint:subscription?.endpoint||null}));
    if(!saved.ok)throw Error('Could not save the notification preference.');
    await refresh();
    announce(subscription?'Rush notifications enabled for this sign-in.':'Phone notifications turned off.');
  }catch(error){announce(error.message,true);}
}

  const messages=document.querySelector('#chat-messages');
  if(!messages)return null;
  messages.insertAdjacentHTML('beforeend',`<article class="chat-line ${from}"><p>${safe(content)}</p>${body}</article>`);
  messages.scrollTop=messages.scrollHeight;
  return messages.lastElementChild;
}
function chatConfirmation(label,action,fields={},id='') {
  const key=++nextChatAction;
  chatActions.set(key,{action,id,fields});
  return button(label,'chat-confirm',key,'','primary');
}

function chatDate(text,reference) {
  if(/^\d{4}-\d{2}-\d{2}$/.test(text)){localTime(text,'00:00');return text;}
  const match=text.match(/^([a-z]+)\s+(\d{1,2})(?:,?\s+(\d{4}))?$/i);
  if(!match)throw Error('Use a date like Nov 25 or 2026-11-25.');
  const month=months.indexOf(match[1].toLowerCase().slice(0,3))+1;
  if(!month)throw Error('Choose a valid month.');
  const suffix='-'+String(month).padStart(2,'0')+'-'+match[2].padStart(2,'0');
  let year=Number(match[3]||reference.slice(0,4));
  if(!match[3]&&year+suffix<reference)year++;
  const date=year+suffix;
  localTime(date,'00:00');
  return date;
}
function leavePrompt(prompt) {
  const match=prompt.match(/\bfrom\s+(.+?)\s+(?:to|through|until)\s+(.+?)[.!?]*$/i);
  if(!match)throw Error('Include both dates, for example “Request leave from Nov 25 to Nov 27”.');
  const first=chatDate(match[1],inputDate(data.now));
  const last=chatDate(match[2],inputDate(data.now));
  const range=leaveRange(first,last,data.now,data.leaves);
  addChatLine('sigma',`Request leave from ${formatDay(range.start)} through ${formatDay(range.end-1)}?`,chatConfirmation('Confirm leave request','leave-request',{first,last}));
}
function preferencesPrompt(prompt) {
  const preferred=blocks.filter(block=>new RegExp('\\b'+block.toLowerCase()+'s?\\b','i').test(prompt));
  const names=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  const short='(?:mon(?:day)?|tue(?:sday)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)';
  const span=prompt.match(new RegExp('\\b('+short+')\\s*(?:[-–—]|to|through)\\s*('+short+')\\b','i'));
  const dayIndex=value=>weekdays.findIndex(day=>day.toLowerCase()===value.toLowerCase().slice(0,3));
  let days=weekdays.filter((day,index)=>new RegExp('\\b(?:'+day+'|'+names[index]+')\\b','i').test(prompt));
  if(span){
    const start=dayIndex(span[1]),end=dayIndex(span[2]);
    days=Array.from({length:(end-start+7)%7+1},(_,offset)=>weekdays[(start+offset)%7]);
  }else if(/\bweekdays\b/i.test(prompt))days=weekdays.slice(0,5);
  else if(/\bweekends?\b/i.test(prompt))days=weekdays.slice(5);
  if(!preferred.length)throw Error('Choose Morning, Afternoon or Overnight, for example “Set my preferred hours to mornings Mon–Fri”.');
  const fields={...data.profile,days:days.length?days:data.profile.days,blocks:preferred};
  addChatLine('sigma',`Save ${fields.blocks.join(', ')} on ${fields.days.join(', ')||'no selected days'}? Your weekly target and rush setting stay as shown in Working hours.`,chatConfirmation('Save working preferences','preferences',fields));
}
function extraShiftsPrompt(prompt) {
  let available=guardOpenShifts();
  if(/\bthis week\b/i.test(prompt)){
    const today=inputDate(data.now);
    const weekday=(new Date(today+'T12:00Z').getUTCDay()+6)%7;
    const nextMonday=calendarDate(today,7-weekday);
    available=available.filter(r=>inputDate(r.start)<nextMonday);
  }
  if(!available.length){addChatLine('sigma','There are no eligible regular shifts in that period.');return;}
  const cards=available.map(r=>`<div class="entry"><strong>${safe(r.location.area)}</strong>
    <p class="sub">${shiftTime(r)} · ${safe(r.location.uniform)}</p>${chatConfirmation('Request shift','volunteer',{},r.id)}</div>`).join('');
  addChatLine('sigma',`I found ${available.length} eligible regular ${available.length===1?'shift':'shifts'}.`,cards);
}
function clientRequestPrompt(prompt) {
  const fields=parseRequestDraft(prompt);
  if(!fields.site||!fields.date||!fields.time||!fields.hours||!fields.count)throw Error('Include your site, number of guards, start date and time, and duration.');
  if(localTime(fields.date,fields.time)<=data.now)throw Error('Choose a future start time.');
  const site=siteBy(fields.site);
  const requirements=[fields.force?'Use of force / MORB':'',fields.vehicle?'Vehicle / lockbox':''].filter(Boolean);
  addChatLine('sigma',`${fields.count} guards at ${site.name} on ${formatDay(localTime(fields.date,fields.time))} at ${fields.time} for ${fields.hours} hours.${fields.supervisors?' Supervisor posts: '+fields.supervisors+'.':''}${requirements.length?' '+requirements.join(' · ')+'.':''}`,chatConfirmation('Submit request','create-request',fields));
}

function localFallbackHint() {
  if(view.role==='guard')return 'Ask about your next shift, extra shifts, leave dates, or preferred hours. (To enable open-ended AI answers, add a free API key to .env on the server.)';
  if(view.role==='client')return 'Ask about today’s coverage or describe a staffing request with a site, start, and duration. (To enable open-ended AI answers, add a free API key to .env on the server.)';
  return 'To enable AI answers for administrators, add a free API key (e.g. GROQ_API_KEY or GEMINI_API_KEY) to .env and restart the server.';
}

async function askSigmaAI(prompt) {
  if(location.protocol==='file:'||typeof offlineBundle!=='undefined'){
    addChatLine('sigma',localFallbackHint());
    return;
  }
  const accountId=account?.id;
  const role=view.role;
  const pendingLine=addChatLine('sigma','Thinking…');
  const sendBtn=document.querySelector('#chat-form button');
  if(sendBtn)sendBtn.disabled=true;
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,history:chatHistory})
    });
    const result=await res.json();
    if(account?.id!==accountId||view.role!==role)return;
    const text=res.ok
      ?(result.configured&&result.reply?result.reply:localFallbackHint())
      :(result.error||'Could not reach Ask Sigma AI.');
    if(pendingLine)pendingLine.querySelector('p').textContent=text;
    if(res.ok&&result.configured&&result.reply){
      chatHistory.push({role:'user',content:prompt},{role:'assistant',content:result.reply});
      if(chatHistory.length>12)chatHistory=chatHistory.slice(-12);
    }
  }catch{
    if(pendingLine)pendingLine.querySelector('p').textContent='Could not reach the server AI endpoint.';
  }finally{
    if(sendBtn)sendBtn.disabled=false;
    const messages=document.querySelector('#chat-messages');
    if(messages)messages.scrollTop=messages.scrollHeight;
  }
}

function askSigma(prompt) {
  addChatLine('you',prompt);
  try{
    if(view.role==='guard'){
      if(/\b(next|upcoming|current)\b.*\bshift\b/i.test(prompt)){
        const next=guardAssignments()[0];
        addChatLine('sigma',next?`${next.location.name} · ${shiftTime(next)} · ${next.location.uniform} · ${briefStatus(next)}.`:'There are no current or upcoming confirmed shifts.');
        return;
      }
      if(/\b(extra|open|available|regular)\b.*\bshifts?\b/i.test(prompt)){extraShiftsPrompt(prompt);return;}
      if(/\b(?:leave|time off)\b/i.test(prompt)){leavePrompt(prompt);return;}
      if(/\b(?:prefer(?:red|ences?)?|working hours)\b/i.test(prompt)){preferencesPrompt(prompt);return;}
    }else if(view.role==='client'){
      if(/\b(?:confirmed|coverage|filled)\b/i.test(prompt)){
        const today=inputDate(data.now);
        const end=localTime(calendarDate(today,1),'00:00');
        const requests=requestsForClient().filter(r=>r.start<end&&r.end>data.now);
        addChatLine('sigma',requests.length?`Today: ${requests.reduce((n,r)=>n+confirmedCount(r),0)} of ${requests.reduce((n,r)=>n+r.need,0)} guards confirmed across ${requests.length} active ${requests.length===1?'request':'requests'}.`:'There are no active requests for your company today.');
        return;
      }
      if(/\b(?:guards?|coverage|request)\b/i.test(prompt)){clientRequestPrompt(prompt);return;}
    }
    askSigmaAI(prompt);
  }catch(error){addChatLine('sigma',error.message);}
}

function handleChatAction(action,id) {
  if(action==='chat-toggle'){
    chatOpen=!chatOpen;
    renderChat();
    document.querySelector(chatOpen?'#chat-prompt':'.chat-trigger')?.focus();
    return true;
  }
  if(action==='chat-prompt'){
    const prompt=chatPrompts()[Number(id)];
    if(prompt)askSigma(prompt);
    return true;
  }
  if(action==='chat-confirm'){
    const pending=chatActions.get(Number(id));
    const control=document.querySelector(`[data-action=chat-confirm][data-id="${Number(id)}"]`);
    if(pending&&control&&!busy){
      control.disabled=true;
      const accountId=account.id;
      submitAction(pending.action,pending.id,'',pending.fields).then(success=>{
        if(account?.id!==accountId)return;
        if(success){
          chatActions.delete(Number(id));
          control.textContent='Confirmed';
          addChatLine('sigma','Saved. You can see the update in your workspace.');
        }else{
          control.disabled=false;
          addChatLine('sigma','That action could not be completed. Check the message in your workspace.');
        }
      });
    }
    return true;
  }
  return false;
}
