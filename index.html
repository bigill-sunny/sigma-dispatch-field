body:has(.guard-tabs) .chat-trigger{bottom:calc(76px + env(safe-area-inset-bottom))}body:has(.guard-tabs) .chat-drawer{bottom:calc(131px + env(safe-area-inset-bottom));max-height:55dvh}.head{min-height:56px}.command{margin-bottom:12px;padding-bottom:8px}.field-heading{margin:8px 0 14px}.shell:has(.guard-tabs) .entry select{max-width:100%}

    .calendar-marker{display:inline-flex;align-items:center;gap:5px;font-size:.77rem;line-height:1.3;font-weight:700;color:var(--marker-text);white-space:nowrap}
    .calendar-booked{--marker:#25e779;--marker-edge:#13753d;--marker-text:#176439}
    .calendar-available,.calendar-pending{--marker:#ff5157;--marker-edge:#a62437;--marker-text:#9d2336}
    .calendar-dot{display:inline-block;width:9px;height:9px;border:1px solid var(--marker-edge);border-radius:50%;background:var(--marker);flex:none}
    .calendar-pending .calendar-dot{background:white;border:2px solid var(--marker)}
    .days button .calendar-day-markers{position:absolute;bottom:3px;left:0;right:0;padding:0;display:flex;justify-content:center;gap:3px}
    .days button .calendar-marker,.days button .calendar-dot{padding:0}
    .days button .calendar-dot{width:7px;height:7px}
    .calendar-legend{border-top:1px solid var(--line);margin-top:8px;padding-top:9px;gap:12px}
    .week-shift{display:grid;text-align:left;gap:3px;margin:2px 0;min-width:9.5rem}

    .calendar-zoom{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0 12px}

    .calendar-zoom button:disabled{opacity:.45;cursor:default}
    .calendar-zoom output{min-width:4ch;text-align:center;font-variant-numeric:tabular-nums}
    .calendar-scalable{--calendar-scale:1}
    .calendar-scalable[data-calendar-size="125"]{--calendar-scale:1.25}

<body>
  <header><div class="head"><div class="brand"><span class="mark" aria-hidden="true">Σ</span>Sigma Dispatch</div><div id="account"></div></div></header>
