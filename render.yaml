services:
  - type: web
    name: sigma-dispatch-field
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && node server.js --prepare-demo-users
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: SIGMA_PILOT_KEY
        generateValue: true
